# Builds the app on GitHub's servers every time code is pushed,
# then publishes the APK on the repo's Releases page so you can
# download and install it straight from your phone.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: [backlog-data.json] # updating your data doesn't need a new build
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || {
            # Show compile errors as annotations so they're visible without opening the log.
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BacklogQuest-${{ github.run_number }}.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Backlog Quest build ${{ github.run_number }}
          body: Download the .apk below on your phone and tap it to install.
          files: BacklogQuest-${{ github.run_number }}.apk
